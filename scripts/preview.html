<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrHush - profile card preview</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 32px 24px 64px;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f6f8fa;
    color: #1f2328;
  }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p.hint { margin: 0 0 24px; color: #59636e; }
  section { margin: 0 0 40px; }
  .label {
    display: flex; align-items: baseline; gap: 12px;
    margin: 0 0 8px; font-size: 12px; letter-spacing: .02em;
    text-transform: uppercase; color: #59636e;
  }
  .label b { color: #1f2328; font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 13px; }
  .stage { padding: 24px; border-radius: 10px; }
  .stage.dark  { background: #0d1117; }
  .stage.light { background: #ffffff; border: 1px solid #d0d7de; }
  /* 880px is roughly the README content column on desktop GitHub. */
  .ruler {
    width: min(880px, 100%);
    outline: 1px dashed rgba(255, 122, 0, .55);
    outline-offset: 8px;
  }
  .ruler img { display: block; width: 100%; height: auto; }
  .meta { margin-top: 10px; font-size: 12px; color: #8b949e; font-family: ui-monospace, Consolas, Menlo, monospace; }
</style>
</head>
<body>
  <h1>Profile card preview</h1>
  <p class="hint" id="hint">Dashed orange box = ~880px, the README column width on desktop GitHub.</p>

  <section>
    <div class="label"><b>dark_mode.svg</b> prefers-color-scheme: dark</div>
    <div class="stage dark">
      <div class="ruler"><img id="dark" src="../assets/dark_mode.svg" alt="Dark theme card"></div>
      <div class="meta" id="dark-meta"></div>
    </div>
  </section>

  <section>
    <div class="label"><b>light_mode.svg</b> prefers-color-scheme: light</div>
    <div class="stage light">
      <div class="ruler"><img id="light" src="../assets/light_mode.svg" alt="Light theme card"></div>
      <div class="meta" id="light-meta"></div>
    </div>
  </section>

<script>
  const override = new URLSearchParams(location.search).get('file');
  for (const img of document.querySelectorAll('img')) {
    if (override) img.src = override;
    img.addEventListener('load', () => {
      const meta = document.getElementById(img.id + '-meta');
      if (meta) meta.textContent = `natural size ${img.naturalWidth} x ${img.naturalHeight} px`;
    });
  }
  if (override) document.getElementById('hint').textContent = 'Previewing ' + override;
</script>
</body>
</html>
